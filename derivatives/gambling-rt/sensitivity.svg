<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310">
<title>First-to-third run response-time sensitivity</title>
<desc>Equal participant mean change and participant bootstrap 95% percentile intervals. Negative means shorter RT in run 03.</desc>
<rect width="900" height="310" fill="white"/>
<g font-family="sans-serif" font-size="14" fill="#20252b">
<text x="20" y="26" font-size="18">Run 03 minus run 01: estimator sensitivity</text>
<line x1="406.25" x2="406.25" y1="45" y2="230" stroke="#888" stroke-dasharray="4 4"/>
<text x="20" y="75">Median, primary (n=16)</text>
<line x1="330.69" x2="548.86" y1="70" y2="70" stroke="#23628a" stroke-width="3"/>
<circle cx="439.94" cy="70" r="5" fill="#123d59"/>
<text x="700" y="75" font-size="12">31.3 [-70.3, 132.7]</text>
<text x="20" y="120">Mean, primary (n=16)</text>
<line x1="366.92" x2="568.28" y1="115" y2="115" stroke="#23628a" stroke-width="3"/>
<circle cx="469.36" cy="115" r="5" fill="#123d59"/>
<text x="700" y="120" font-size="12">58.7 [-36.6, 150.7]</text>
<text x="20" y="165">Median, 0.2–3.0 s (n=16)</text>
<line x1="305.50" x2="536.26" y1="160" y2="160" stroke="#23628a" stroke-width="3"/>
<circle cx="418.24" cy="160" r="5" fill="#123d59"/>
<text x="700" y="165" font-size="12">11.2 [-93.7, 120.9]</text>
<text x="20" y="210">Mean, 0.2–3.0 s (n=16)</text>
<line x1="331.05" x2="543.98" y1="205" y2="205" stroke="#23628a" stroke-width="3"/>
<circle cx="436.04" cy="205" r="5" fill="#123d59"/>
<text x="700" y="210" font-size="12">27.7 [-70.0, 128.1]</text>
<text x="245.00" y="252" text-anchor="middle">-150</text>
<text x="331.00" y="252" text-anchor="middle">-70</text>
<text x="417.00" y="252" text-anchor="middle">10</text>
<text x="503.00" y="252" text-anchor="middle">90</text>
<text x="589.00" y="252" text-anchor="middle">170</text>
<text x="675.00" y="252" text-anchor="middle">250</text>
<text x="460" y="277" text-anchor="middle">Change in decision RT (ms); bars: 95% bootstrap intervals</text>
<text x="20" y="300" font-size="12">Band is a declared sensitivity choice; it is not a documented response deadline.</text>
</g></svg>
